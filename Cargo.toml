[package]
name = "attention_blackhole"
version = "0.1.0"
edition = "2021"

[lib]
name = "attention_blackhole"
path = "src/lib.rs"

# 注意：不显式声明 [[example]]。Cargo 会自动发现 examples/ 下的 *.rs 作为 example
# 目标，因此在 Task 7 创建 examples/cli_demo.rs 之前，cargo build/test 不会因为
# 缺失 example 文件而失败。

# platform 层（Plan 2）需要 windows crate。cfg-gated：非 windows 平台不拉依赖，
# 保证 model/controller 核心在任意平台零外部依赖。
[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",             # BOOL / HANDLE / LPARAM / WPARAM / LRESULT 等
    "Win32_System_LibraryLoader",   # GetModuleHandleW（SetWindowsHookExW 的 hMod）
    "Win32_System_Threading",       # GetCurrentThreadId（hook 线程 id 回传）
    "Win32_UI_WindowsAndMessaging", # SetWindowsHookExW / WH_*_LL / KBDLLHOOKSTRUCT
                                    #   GetForegroundWindow / GetWindowTextW
                                    #   GetMessageW / PostThreadMessageW / CallNextHookEx
    # Plan 3 —— D3D11 渲染设备与交换链
    "Win32_Graphics_Direct3D",      # D3D_FEATURE_LEVEL_* / D3D11CreateDevice
    "Win32_Graphics_Direct3D_Fxc",  # D3DCompile + ID3DBlob / ID3DInclude（shader 运行时编译）
    "Win32_Graphics_Direct3D11",    # ID3D11Device / ID3D11DeviceContext / ID3D11Texture2D 等
    "Win32_Graphics_Dxgi",          # IDXGIDevice / IDXGISwapChain / IDXGIFactory
    "Win32_Graphics_Dxgi_Common",   # DXGI_FORMAT / DXGI_SWAP_CHAIN_DESC（desc 引用公共类型）
    "Win32_Graphics_Gdi",           # RegisterClassExW / WNDCLASSEXW / HINSTANCE（窗口类注册历史耦合 GDI）
    "Win32_Graphics_Dwm",           # DWM 命名空间（DwmExtendFrameIntoClientArea 入口）
    "Win32_UI_Controls",            # MARGINS + DwmExtendFrameIntoClientArea 实现（DWM API 实际落在 Controls）
    # Plan 3 —— WGC 真实窗口捕获（透镜扭曲采样源）
    "Graphics_Capture",             # GraphicsCaptureItem / GraphicsCaptureSession / Direct3D11CaptureFramePool
    "Graphics_DirectX_Direct3D11",  # IDirect3DDevice (WinRT) + IDirect3DDxgiInterfaceAccess 桥接
    "Graphics_DirectX",             # IDirect3DSurface / DirectXPixelFormat 基础
    "Foundation",                   # TypedEventHandler（WGC 帧到达回调）
    "Win32_System_WinRT_Direct3D11", # CreateDirect3D11DeviceFromDXGIDevice（device 互操作桥接）
    "Win32_System_WinRT_Graphics_Capture", # IGraphicsCaptureItemInterop（HWND→item 互操作，若需）
]
